name: Send release artifacts to Telegram
# Called explicitly only after a successful release publication, never from an
# unrelated workflow_run or a pull-request artifact. Disabled unless opted in.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID_CHANNEL:
        required: true
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Download published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG_NAME" --dir release-assets --pattern 'zenith_*' --pattern 'zenith-*' --pattern SHA256SUMS
          python scripts/release.py verify --directory release-assets
      - name: Send release files
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_CHANNEL: ${{ secrets.TELEGRAM_CHAT_ID_CHANNEL }}
          TAG_NAME: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID_CHANNEL}" \
            --data-urlencode "text=Release ${REPOSITORY}@${TAG_NAME}: ${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG_NAME}" \
            "$api/sendMessage" > telegram-response.json
          python -c 'import json; assert json.load(open("telegram-response.json")).get("ok"), "Telegram rejected message"'
          for file in release-assets/*; do
            curl --fail-with-body --silent --show-error --max-time 120 \
              --form-string "chat_id=${TELEGRAM_CHAT_ID_CHANNEL}" \
              --form-string "caption=${TAG_NAME}: $(basename "$file")" \
              --form "document=@${file}" "$api/sendDocument" > telegram-response.json
            python -c 'import json; assert json.load(open("telegram-response.json")).get("ok"), "Telegram rejected file"'
          done
