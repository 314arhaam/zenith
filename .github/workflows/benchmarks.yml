name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            python_arch: x64
            ext: ''
            race_flag: '--race'
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            python_arch: arm64
            ext: ''
            race_flag: '--race'
          - runner: windows-2025
            goos: windows
            goarch: amd64
            python_arch: x64
            ext: '.exe'
            race_flag: '--race'
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            python_arch: arm64
            ext: '.exe'
            race_flag: ''
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            python_arch: x64
            ext: ''
            race_flag: '--race'
          - runner: macos-15
            goos: darwin
            goarch: arm64
            python_arch: arm64
            ext: ''
            race_flag: '--race'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          architecture: ${{ matrix.python_arch }}
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.python_arch }}
      - run: python scripts/dev.py doctor --expect-target ${{ matrix.goos }}/${{ matrix.goarch }}
      - name: Record native benchmark samples
        env:
          GOMAXPROCS: '4'
        run: python scripts/dev.py bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/benchmarks.txt
          if-no-files-found: error
