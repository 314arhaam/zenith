name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  tested-builds:
    # Builds once, then executes those artifacts on all six native targets.
    uses: ./.github/workflows/e2e.yml
  publish:
    needs: [quality, tested-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify all 12 executables and six bundles; aggregate checksums
        run: python scripts/release.py combine --directory artifacts/release
      - name: Stage verified assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZENITH_RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py --directory artifacts/release
  notify:
    needs: publish
    if: ${{ vars.ENABLE_TELEGRAM == 'true' }}
    uses: ./.github/workflows/send_telegram.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_CHANNEL: ${{ secrets.TELEGRAM_CHAT_ID_CHANNEL }}
