name: E2E
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  builds:
    uses: ./.github/workflows/build.yml
  lifecycle:
    name: Released binaries on ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            python_arch: x64
            ext: ''
            race_flag: '--race'
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            python_arch: arm64
            ext: ''
            race_flag: '--race'
          - runner: windows-2025
            goos: windows
            goarch: amd64
            python_arch: x64
            ext: '.exe'
            race_flag: '--race'
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            python_arch: arm64
            ext: '.exe'
            race_flag: ''
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            python_arch: x64
            ext: ''
            race_flag: '--race'
          - runner: macos-15
            goos: darwin
            goarch: arm64
            python_arch: arm64
            ext: ''
            race_flag: '--race'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.python_arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/release
      - name: Verify and unpack the exact release bundle
        run: python scripts/release.py unpack --directory artifacts/release --target ${{ matrix.goos }}/${{ matrix.goarch }} --destination artifacts/unpacked
      - name: Process E2E including console signals and paths with spaces/Unicode
        # Default native shell: PowerShell on Windows; bash on Unix.
        # No Go installation, Bash, curl or Make is needed to run Windows binaries.
        run: >-
          python scripts/e2e.py
          --server artifacts/unpacked/zenith-${{ matrix.goos }}-${{ matrix.goarch }}/zenith-server${{ matrix.ext }}
          --client artifacts/unpacked/zenith-${{ matrix.goos }}-${{ matrix.goarch }}/zenith-client${{ matrix.ext }}
          --require-executable
          --log-dir artifacts/e2e
      - name: Upload process evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
